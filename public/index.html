<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d16" />
  <link rel="manifest" href="/manifest.json" />
  <title>Apex Footy</title>
  <style>
    :root {
      --bg: #090d16; --surface: #131b2e; --surface-2: #1c2742;
      --text: #f8fafc; --muted: #94a3b8; --accent: #22c55e;
      --live: #ef4444; --border: #263354;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 78px; }
    .topbar {
      position: sticky; top: 0; z-index: 20; background: rgba(9,13,22,0.95);
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .brand { font-weight: 800; font-size: 1.05rem; color: var(--accent); }
    select, input {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 10px; font-size: 0.88rem; outline: none;
    }
    .content { padding: 12px; max-width: 720px; margin: 0 auto; }
    .search-bar { width: 100%; margin-bottom: 12px; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px; margin-bottom: 10px;
    }
    .table-wrap { overflow-x: auto; background: var(--surface); border-radius: 14px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--muted); font-size: 0.76rem; }
    .match-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; }
    .live-pill { background: var(--live); color: #fff; padding: 2px 8px; border-radius: 99px; font-weight: 700; }
    .match-row { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 0.95rem; }
    .score { background: var(--bg); color: var(--accent); padding: 4px 10px; border-radius: 8px; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
      border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(3, 1fr);
      padding: 8px 0; z-index: 30;
    }
    .nav-btn {
      background: none; border: none; color: var(--muted); font-size: 0.78rem;
      display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 600;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-btn span.ico { font-size: 1.2rem; }
    .empty { color: var(--muted); text-align: center; padding: 24px 10px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">⚽ APEX FOOTY</div>
    <select id="league">
      <option value="PL">Premier League</option>
      <option value="CL">Champions League</option>
      <option value="PD">La Liga</option>
      <option value="SA">Serie A</option>
      <option value="BL1">Bundesliga</option>
      <option value="FL1">Ligue 1</option>
  <option value="NBC">NBC Premier League</option>
  <option value="CAF">CAF Champions League</option>
    </select>
  </div>

  <div class="content">
    <input type="text" id="team-search" class="search-bar" placeholder="🔍 Tafuta timu (mfano: Arsenal)..." />
    <div id="status-msg" style="font-size:0.78rem; color:var(--muted); margin-bottom:10px;">Inapakia...</div>

    <div id="tab-standings" class="panel active">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>Timu</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>
          </thead>
          <tbody id="standings-body"></tbody>
        </table>
      </div>
    </div>

    <div id="tab-live" class="panel"></div>
    <div id="tab-fixtures" class="panel"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-target="tab-standings"><span class="ico">🏆</span>Standings</button>
    <button class="nav-btn" data-target="tab-live"><span class="ico">🔴</span>Live & Results</button>
    <button class="nav-btn" data-target="tab-fixtures"><span class="ico">📅</span>Fixtures</button>
  </nav>
  <script>
    let currentData = null;

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.target).classList.add('active');
      });
    });

    function formatTime(iso) {
      return new Date(iso).toLocaleString('en-GB', {
        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
      });
    }

    function matchCard(m, live = false) {
      const h = m.homeTeam.shortName || m.homeTeam.name;
      const a = m.awayTeam.shortName || m.awayTeam.name;
      const hasScore = m.score?.fullTime?.home !== null && m.score?.fullTime?.home !== undefined;
      const sc = hasScore ? `${m.score.fullTime.home} - ${m.score.fullTime.away}` : 'VS';
      return `
        <div class="card">
          <div class="match-meta">
            <span>${formatTime(m.utcDate)}</span>
            ${live ? `<span class="live-pill">LIVE</span>` : `<span>${m.status}</span>`}
          </div>
          <div class="match-row">
            <span>${h}</span>
            <span class="score">${sc}</span>
            <span>${a}</span>
          </div>
        </div>
      `;
    }

    function renderAll() {
      if (!currentData) return;
      const q = document.getElementById('team-search').value.trim().toLowerCase();

      const tbody = document.getElementById('standings-body');
      const rows = (currentData.table || []).filter(r => {
        if (!q) return true;
        return (r.team.name || '').toLowerCase().includes(q) || (r.team.shortName || '').toLowerCase().includes(q);
      });
      tbody.innerHTML = rows.length
        ? rows.map(r => `
            <tr>
              <td>${r.position}</td>
              <td>${r.team.shortName || r.team.name}</td>
              <td>${r.playedGames}</td>
              <td>${r.won}</td>
              <td>${r.draw}</td>
              <td>${r.lost}</td>
              <td>${r.goalDifference}</td>
              <td><strong>${r.points}</strong></td>
            </tr>
          `).join('')
        : `<tr><td colspan="8" class="empty">Hakuna timu iliyopatikana.</td></tr>`;

      const filterMatch = m => !q ||
        (m.homeTeam.name || '').toLowerCase().includes(q) ||
        (m.awayTeam.name || '').toLowerCase().includes(q) ||
        (m.homeTeam.shortName || '').toLowerCase().includes(q) ||
        (m.awayTeam.shortName || '').toLowerCase().includes(q);

      const liveList = (currentData.liveMatches || []).filter(filterMatch);
      const recentList = (currentData.recentFinished || []).filter(filterMatch);

      let liveHtml = liveList.length
        ? liveList.map(m => matchCard(m, true)).join('')
        : `<div class="empty">Hakuna mechi LIVE kwa sasa.</div>`;

      if (recentList.length) {
        liveHtml += `<h4 style="margin:12px 0 8px; color:var(--muted);">Matokeo ya Hivi Karibuni</h4>`;
        liveHtml += recentList.map(m => matchCard(m, false)).join('');
      }
      document.getElementById('tab-live').innerHTML = liveHtml;

      const fixList = (currentData.fixtures || []).filter(filterMatch);
      document.getElementById('tab-fixtures').innerHTML = fixList.length
        ? fixList.map(m => matchCard(m, false)).join('')
        : `<div class="empty">Hakuna ratiba iliyopatikana.</div>`;
    }

    async function fetchLeague() {
      const league = document.getElementById('league').value;
      const msg = document.getElementById('status-msg');
      msg.textContent = 'Inasasisha taarifa...';
      try {
        const res = await fetch(`/api/data?league=${league}`);
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Imeshindwa kupakia');
        currentData = data;
        msg.textContent = `${data.competition} • Imesasishwa ${new Date().toLocaleTimeString('en-GB')}`;
        renderAll();
      } catch (e) {
        msg.textContent = `⚠️ ${e.message}`;
      }
    }

    document.getElementById('league').addEventListener('change', fetchLeague);
    document.getElementById('team-search').addEventListener('input', renderAll);
    fetchLeague();
  setInterval(fetchLeague, 5000);
  </script>
</body>
</html>
